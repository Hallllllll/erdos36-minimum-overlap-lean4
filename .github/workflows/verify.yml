name: Verify

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: '1'
      REPLAY_MODULES: >-
        Tree PackedConvolution ConvolutionExample Data Numerical Algebra
        AffineBridge Profile Spec Main QuarticRounding CellApprox GridLower
        LagRounding DiscreteUpper FormalConjecturesDefs FormalConjecturesBridge Bench
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan and Lean
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Compare Erdos36 definitions to the pinned upstream source
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/36.lean" \
            https://raw.githubusercontent.com/google-deepmind/formal-conjectures/ea8e3e198ded6fc73efb7f5653b74b28ac4ae1a8/FormalConjectures/ErdosProblems/36.lean
          bash scripts/check_formal_conjectures.sh "$RUNNER_TEMP/36.lean"

      - name: Build Lean proofs
        run: lake build

      - name: Build supplementary benchmark module
        run: lake build Overlap.Bench

      - name: Enforce import-only root module
        run: |
          if grep -Evn \
            '^[[:space:]]*(import[[:space:]]+Overlap\.[A-Za-z0-9_]+[[:space:]]*|[[:space:]]*)$' \
            Overlap.lean; then
            echo "Overlap.lean must contain only imports of Overlap modules" >&2
            exit 1
          fi

      - name: Replay Lean declarations
        run: |
          ulimit -s unlimited
          for module in $REPLAY_MODULES; do
            echo "Replaying Overlap.$module"
            lake env leanchecker "Overlap.$module"
          done

      - name: Check replay-list completeness
        run: |
          for file in Overlap/*.lean; do
            module="${file##*/}"
            module="${module%.lean}"
            found=0
            for listed in $REPLAY_MODULES; do
              if [[ "$listed" == "$module" ]]; then
                found=1
                break
              fi
            done
            if [[ "$found" -ne 1 ]]; then
              echo "missing from REPLAY_MODULES: $module" >&2
              exit 1
            fi
          done

      - name: Print paper axiom dependencies
        run: |
          ulimit -s unlimited
          lake env lean scripts/paper_axioms.lean > "$RUNNER_TEMP/axioms.txt"
          cat "$RUNNER_TEMP/axioms.txt"
          diff -u paper/validation/axioms.txt "$RUNNER_TEMP/axioms.txt"

      - name: Verify Python certificates
        run: |
          python3 verify.py
          python3 audit_verify.py

      - name: Check generated paper metrics
        run: python3 paper/metrics.py --check

      - name: Verify generated Lean sources
        run: |
          python3 scripts/generate.py
          git diff --exit-code -- Overlap/Data.lean Overlap/Bench.lean
